<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#030308" />
  <title>Cipher Vault Terminal</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #030308; --neon-cyan: #00f0ff; --neon-violet: #a855f7; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: #eaeaf4; font-family: 'JetBrains Mono', monospace; height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #030308; border-left: 1px solid rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00f0ff, #a855f7); border-radius: 5px; border: 2px solid #030308; }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #00f0ff, #00ccff); }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500/20 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
